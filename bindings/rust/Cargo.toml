[package]
name = "openpano"
version = "0.1.0"
edition = "2021"
authors = ["OpenPano Contributors"]
description = "Safe Rust bindings for OpenPano panorama stitching library"
license = "MIT"
repository = "https://github.com/ppwwyyxx/OpenPano"
documentation = "https://docs.rs/openpano"
readme = "README.md"
keywords = ["panorama", "image-stitching", "computer-vision", "ffi"]
categories = ["multimedia::images", "api-bindings"]

[lib]
name = "openpano"
path = "src/lib.rs"

[dependencies]
thiserror = "1.0"
libc = "0.2"

[build-dependencies]
bindgen = "0.69"
cc = "1.0"
pkg-config = "0.3"

[dev-dependencies]
image = "0.24"
tempfile = "3.0"

[features]
default = []
# Use system-installed OpenPano instead of building from source
system = []
# Build with JPEG support
jpeg = []

[package.metadata.docs.rs]
features = ["jpeg"]

